# takt グローバル設定
# 全設定項目は https://github.com/nrslib/takt/blob/main/docs/configuration.md を参照。
#
# 秘匿情報 (anthropic_api_key など) はここに書かないこと。
# このリポジトリは public。API キーが必要な場合は TAKT_ANTHROPIC_API_KEY 等の環境変数を使う。

language: ja

# provider / model はトップレベル指定 = 最弱のフォールバック (優先度 11)。
# 実際のステップ割り当ては下部の provider_routing で行う。
#
# NOTE: model の解決は provider 一致で絞り込まれない。
# provider だけを上書きするルーティング (例: coding -> codex) を書くと、
# model はここまで落ちてきて codex に opus が渡ってしまう。
# 別プロバイダへ振るエントリでは必ず model も併記すること。
provider: claude
model: opus

minimal_output: false
interactive_preview_steps: 3

# 同時実行するタスク数 (既定 1)。8 コア / 32GB に対して余裕を持たせて 2 から始める。
concurrency: 2

# 一時的な失敗 (ネットワーク断・レート制限) を 1 回だけ拾い直す (既定 0 = 再キューしない)。
# 回数を増やすと同じ失敗を繰り返すだけになるため 1 に留める。
auto_requeue_max_attempts: 1

logging:
  level: info

# ワークフローは worktree で長時間走るため、実行中の macOS スリープを抑止する。
prevent_sleep: true

# worktree を切る前に remote を fetch し、古い base から分岐する事故を防ぐ。
auto_fetch: true

# 日本語のタスク名を romaji 直訳せず、AI に英語ブランチ名を生成させる。
branch_name_strategy: ai

# takt の作業ディレクトリの置き場所。相対パスは projectDir 基準で解決される。
# 既定は <project>/../takt-worktrees で、ghq 構成だと ~/ghq/github.com/<user>/ が汚れる。
#
# NOTE: 名前に反して takt が作るのは git worktree ではなく独立クローン
#       (git clone --reference <project> --dissociate)。したがって:
#       - gtr (wt コマンド) の list / go / rm からは見えない。gtr 管理外。
#       - scripts/repo-list.sh は .worktrees/* をディレクトリ走査するため、
#         repo コマンドと WezTerm セレクタからは拾える。これが同居させる理由。
#       - --dissociate なのでオブジェクトは実体コピー。容量はタスク数×リポジトリサイズ。
# NOTE: 対象プロジェクトの .gitignore に .worktrees/ が必要。
worktree_dir: .worktrees

# プロバイダごとの既定権限。takt の抽象モードは各 CLI に次のように写される:
#            claude            codex
#   readonly default           read-only
#   edit     acceptEdits       workspace-write
#   full     bypassPermissions danger-full-access (使わない)
# codex は takt が approvalPolicy: never を強制するため、サンドボックスモードが唯一の砦になる。
# 編集の可否はワークフロー側の edit フラグ (plan は edit: false) が既に制御しているため、
# ここで readonly に二重に絞らず edit で揃える。
provider_profiles:
  claude:
    default_permission_mode: edit
  codex:
    default_permission_mode: edit

# takt_providers.assistant は設定しない。
# 未設定なら assistant 会話 (対話モードの計画会話・instruct・リトライ対話) は
# トップレベルの provider/model (claude / opus) を解決する。
# ただし Report phase の fallback だけは別で、assistant 未設定時は
# トップレベルへ暗黙フォールバックせず「無効」になる。
# いずれもワークフローの plan ステップとは経路が別 (plan は provider_routing.tags で解決される)。

# ステップの役割 (tags) ごとのプロバイダ割り当て。
# ビルトインワークフローはステップに provider: を書いていないため、
# ここでの指定が全ワークフローに横断で効く (優先度 5 > workflow の 9)。
#
# 実装・テスト作成は Codex、計画・レビュー・最終判定は Claude。実装とレビューが別モデルになる。
#
# NOTE: ここに書けるのはビルトインワークフローが実際に付けている tag だけ。
#       ja ビルトイン 62 本の tag 全集合は以下の 8 種で、それ以外は空振りする:
#         plan / coding / test-planning / review / merge-readiness / final-gate / supervise / leader
#       policy: や knowledge: の値 (architecture, testing, unit-testing ...) は tag ではない。
# NOTE: ai-antipattern-* は step 名であって tag ではないが、steps: に書く必要はない。
#       review 系 (-review / -1st / -2nd / -no-fix) は tag review、
#       fix 系 (-fix / -fix-parallel) は tag coding を持つので下の tags で解決される。
#       steps: に書くと fix 系まで claude に引き戻してしまうので書かないこと。
# NOTE: codex へ振るエントリは model を必ず書く。省略するとトップレベルの opus が渡る。
#       ~/.codex/config.toml の model は takt が model を明示指定するため効かない。
provider_routing:
  tags:
    plan: claude
    review: claude
    merge-readiness: claude
    final-gate: claude
    supervise: claude
    leader: claude
    coding:
      provider: codex
      model: gpt-5.6-sol
      provider_options:
        codex:
          reasoning_effort: xhigh
    test-planning:
      provider: codex
      model: gpt-5.6-sol
      provider_options:
        codex:
          reasoning_effort: xhigh

# claude がレートリミットに当たったとき codex へ退避して実行を継続する。
# switch_chain のエントリは provider / model のみ (provider_options は書けない) なので、
# ここ経由の codex 実行の reasoning effort は ~/.codex/config.toml の xhigh に従う。
rate_limit_fallback:
  switch_chain:
    - provider: codex
      model: gpt-5.6-sol

# opencode を第三のプロバイダとして使う場合の書き方 (現状は未使用)。
# tags の値は文字列 (プロバイダ名) だけでなく {provider, model} も取れるので、
# トップレベルの model: opus に引きずられず opencode 用のモデルを指定できる。
#
#   ai-antipattern:
#     provider: opencode
#     model: opencode-go/glm-5.2
#
# 注意点:
# - opencode は model が必ず "provider/model" 形式である必要がある。
#   モデル名だけを渡すと "requires model in 'provider/model' format" で落ちる。
# - 認証は opencode 側 (~/.local/share/opencode/auth.json) に完全依存し、
#   takt の *_api_key 設定は肩代わりしない (opencode_api_key は opencode zen 用)。
#   現在の認証は opencode-go のみ。使えるモデルは `opencode models` で確認する。
# - Gemini / Antigravity CLI (agy) は takt のプロバイダ enum に無いため直接は使えない。
#   使うとすれば opencode に Google 認証を足して opencode 経由で回す形になる。

# --------------------------------------------------------------------------
# 検討したうえで「既定のまま使う」と判断した項目 (意図的に未設定)
# --------------------------------------------------------------------------
# base_branch   未設定なら origin/HEAD -> main -> master の順で自動判定される。
#               明示すると存在チェックが走るため、master のリポジトリでエラーになる。
# vcs_provider  auto-detect で足りる (GitLab を使っていない)。
# auto_pr       takt list で差分を確認してから手動で PR を作る。
#               自動作成するとレビュー未了の PR が乱立する。
# notification_sound(_events)
#               既定で完了・中断時に鳴る。長時間実行を放置するため全て鳴らしたい。
# observability / analytics
#               既定で無効。コストや失敗傾向を分析したくなってから有効化する。
# ignore_exceed / task_poll_interval_ms
#               安全側の既定 (上限を無視しない / 500ms) で問題ない。
# disabled_builtins
#               実際に使うワークフローが固まってから絞る。
