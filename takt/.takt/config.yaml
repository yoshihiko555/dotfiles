# takt グローバル設定
# 全設定項目は https://github.com/nrslib/takt/blob/main/docs/configuration.md を参照。
#
# 秘匿情報 (anthropic_api_key など) はここに書かないこと。
# このリポジトリは public。API キーが必要な場合は TAKT_ANTHROPIC_API_KEY 等の環境変数を使う。

language: ja

# provider / model はトップレベル指定 = 最弱のフォールバック (優先度 11)。
# 実際のステップ割り当ては下部の provider_routing で行う。
provider: claude
model: opus

minimal_output: false
interactive_preview_steps: 3

# 同時実行するタスク数 (既定 1)。8 コア / 32GB に対して余裕を持たせて 2 から始める。
concurrency: 2

# 一時的な失敗 (ネットワーク断・レート制限) を 1 回だけ拾い直す (既定 0 = 再キューしない)。
# 回数を増やすと同じ失敗を繰り返すだけになるため 1 に留める。
auto_requeue_max_attempts: 1

logging:
  level: info

# ワークフローは worktree で長時間走るため、実行中の macOS スリープを抑止する。
prevent_sleep: true

# worktree を切る前に remote を fetch し、古い base から分岐する事故を防ぐ。
auto_fetch: true

# 日本語のタスク名を romaji 直訳せず、AI に英語ブランチ名を生成させる。
branch_name_strategy: ai

# worktree の置き場所。相対パスは projectDir 基準で解決される。
# 既定は <project>/../takt-worktrees で、ghq 構成だと ~/ghq/github.com/<user>/ が汚れる。
# gtr (wt コマンド) と同じ .worktrees/ に寄せると gtr list / go / rm から扱える
# (gtr は git worktree list ベースなので、takt が作った worktree も認識する)。
# NOTE: 対象プロジェクトの .gitignore に .worktrees/ が必要。
worktree_dir: .worktrees

# プロバイダごとの既定権限。takt の権限モードは claude の --permission-mode に対応する:
#   readonly -> default (禁止ではなく都度確認。headless では応答できず停止しうる)
#   edit     -> acceptEdits
#   full     -> bypassPermissions (全許可、使わない)
# 編集の可否はワークフロー側の edit フラグ (plan は edit: false) が既に制御しているため、
# ここで readonly に二重に絞らず edit で揃える。
provider_profiles:
  claude:
    default_permission_mode: edit
  codex:
    default_permission_mode: edit

# takt_providers.assistant は設定しない。
# 未設定ならトップレベルの provider/model (claude / opus) を継承する。
# assistant は対話セッション・CLI ルーティング判定・レポート生成のフォールバックにのみ使われ、
# ワークフローの plan ステップとは経路が別 (plan は provider_routing.tags で解決される)。

# ステップの役割 (tags) ごとのプロバイダ割り当て。
# ビルトインワークフローはステップに provider: を書いていないため、
# ここでの指定が全ワークフローに横断で効く (優先度 5 > workflow の 9)。
#
# 実装・テストは Codex (codex/.codex/config.toml の gpt-5.6-sol / xhigh)、
# 計画・レビュー・最終判定は Claude。実装とレビューが別モデルになる。
# なお model: opus は provider が claude のステップにのみ適用される
# (モデル解決は provider 一致の候補だけを採用するため)。
provider_routing:
  tags:
    plan: claude
    architecture: claude
    coding: codex
    testing: codex
    review: claude
    ai-antipattern: claude
    final-gate: claude
    supervise: claude

# opencode を第三のプロバイダとして使う場合の書き方 (現状は未使用)。
# tags の値は文字列 (プロバイダ名) だけでなく {provider, model} も取れるので、
# トップレベルの model: opus に引きずられず opencode 用のモデルを指定できる。
#
#   ai-antipattern:
#     provider: opencode
#     model: opencode-go/glm-5.2
#
# 注意点:
# - opencode は model が必ず "provider/model" 形式である必要がある。
#   モデル名だけを渡すと "requires model in 'provider/model' format" で落ちる。
# - 認証は opencode 側 (~/.local/share/opencode/auth.json) に完全依存し、
#   takt の *_api_key 設定は肩代わりしない (opencode_api_key は opencode zen 用)。
#   現在の認証は opencode-go のみ。使えるモデルは `opencode models` で確認する。
# - Gemini / Antigravity CLI (agy) は takt のプロバイダ enum に無いため直接は使えない。
#   使うとすれば opencode に Google 認証を足して opencode 経由で回す形になる。

# --------------------------------------------------------------------------
# 検討したうえで「既定のまま使う」と判断した項目 (意図的に未設定)
# --------------------------------------------------------------------------
# base_branch   未設定なら origin/HEAD -> main -> master の順で自動判定される。
#               明示すると存在チェックが走るため、master のリポジトリでエラーになる。
# vcs_provider  auto-detect で足りる (GitLab を使っていない)。
# auto_pr       takt list で差分を確認してから手動で PR を作る。
#               自動作成するとレビュー未了の PR が乱立する。
# notification_sound(_events)
#               既定で完了・中断時に鳴る。長時間実行を放置するため全て鳴らしたい。
# observability / analytics
#               既定で無効。コストや失敗傾向を分析したくなってから有効化する。
# ignore_exceed / task_poll_interval_ms
#               安全側の既定 (上限を無視しない / 500ms) で問題ない。
# disabled_builtins
#               実際に使うワークフローが固まってから絞る。
