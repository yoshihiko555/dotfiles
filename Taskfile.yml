# Taskfile.yml
# 日常的なタスク管理用。環境と dotfiles の配線は nix-darwin + home-manager が担う。
version: "3"

includes:
  dotfiles:
    taskfile: ./taskfiles/dotfiles.yml
    flatten: true
  skills:
    taskfile: ./taskfiles/skills.yml
    flatten: true
  agents:
    taskfile: ./taskfiles/agents.yml
    flatten: true
  util:
    taskfile: ./taskfiles/util.yml
    flatten: true
  cliproxy:
    taskfile: ./taskfiles/cliproxy.yml
    flatten: true

tasks:
  default:
    desc: どのタスクを使うか迷ったときに一覧を表示
    cmds:
      - task --list
