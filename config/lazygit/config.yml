customCommands:
  - key: "<c-g>"
    context: "files"
    description: "Antigravity で Conventional Commits のメッセージを生成してコミット"
    output: "terminal"
    command: |
      clear

      if git diff --cached --quiet; then
        echo "No staged changes to commit."
        exit 1
      fi

      AGY_BIN="${AGY_BIN:-$(command -v agy || echo "$HOME/.local/bin/agy")}"
      if [ -z "$AGY_BIN" ] || [ ! -x "$AGY_BIN" ]; then
        echo "Antigravity CLI (agy) not found."
        exit 1
      fi

      if ! command -v jq >/dev/null 2>&1; then
        echo "JSON の入出力に必要な jq が見つかりません。"
        exit 1
      fi

      AGY_MODEL="${AGY_MODEL:-Gemini 3.8 Flash (Low)}"

      echo ""
      echo "  ╭─────────────────────────────────────────────╮"
      echo "  │  Generating commit message with Antigravity │"
      echo "  ╰─────────────────────────────────────────────╯"
      echo ""
      echo "  Model : $AGY_MODEL"
      echo "  Staged: $(git diff --cached --stat | tail -1)"
      echo ""
      echo "  ── Usage ──────────────────────────────────────"
      echo "  コミット中止: エディタで :cq または ggdG → :wq"
      echo "  メッセージ編集: エディタで自由に書き換えてOK"
      echo ""

      AGY_ERR="$(mktemp -t lazygit-agy)" || exit 1
      # 大きな差分が OS の引数サイズ上限を超えないよう、JSON を標準入力で渡す。
      AGY_RESPONSE="$(
        {
          cat <<'EOF'
      以下の staged diff だけを根拠に、Conventional Commits 形式の1行コミットメッセージを日本語で生成してください。
      形式: type(scope): 日本語の要約
      type は feat, fix, docs, style, refactor, test, chore のいずれかを使ってください。
      出力はコミットメッセージ本文のみ。コードフェンスや補足説明は禁止です。

      Staged diff:
      EOF
          git diff --cached
        } | jq -Rsc '{event: "user", message: {content: .}}' \
          | "$AGY_BIN" --model "$AGY_MODEL" \
              --input-format stream-json --output-format stream-json 2>"$AGY_ERR"
      )"
      AGY_STATUS=$?

      MSG="$(printf '%s\n' "$AGY_RESPONSE" | jq -ers '
        map(select(.event == "result")) | last | .result |
        if .status == "SUCCESS" then .response // empty
        else error(.error // "Antigravity の生成が完了しませんでした。") end
      ' 2>>"$AGY_ERR")"
      MSG_STATUS=$?

      if [ "$AGY_STATUS" -ne 0 ] || [ "$MSG_STATUS" -ne 0 ] || [ -z "$MSG" ]; then
        echo "Antigravity did not return a commit message."
        if [ -s "$AGY_ERR" ]; then
          echo ""
          echo "  ── agy stderr ─────────────────────────────────"
          cat "$AGY_ERR"
        fi
        rm -f "$AGY_ERR"
        exit 1
      fi
      rm -f "$AGY_ERR"

      git commit -e -m "$MSG"

gui:
  # UI を日本語化する。auto は LANG(en_US.UTF-8) を見て英語になるため明示指定。
  language: ja
