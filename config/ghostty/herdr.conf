# herdr 用キーバインド層（WezTerm の config/wezterm/config/keybinds-herdr.lua と同じ対応表）
#
# WezTerm では Cmd 系のキーを herdr の prefix（Ctrl+Q）+ キーに変換して送っている。
# Ghostty には Lua が無いので、`text:` アクションで同じバイト列を直接送る。
#   \x11 = Ctrl+Q（herdr の prefix）   \x1b = ESC（Alt 修飾の代わり）
# メインの config から `config-file = ?herdr.conf` で読み込む。
# 読み込み順は「メイン → この file」なので、同じキーはこちらが勝つ。

# Option キーを Alt として送る。herdr の alt+hjkl（smart-move）と alt+semicolon（zoom）、
# alt+1..9（switch_tab）が Option で直接押せるようにする。
# WezTerm の send_composed_key_when_left_alt_is_pressed = false と同じ意図。
macos-option-as-alt = true

# ペイン分割: Cmd+D → Ctrl+Q,v（split_vertical） / Cmd+Shift+D → Ctrl+Q,-（split_horizontal）
keybind = cmd+d=text:\x11v
keybind = cmd+shift+d=text:\x11-

# 新規タブ: Cmd+T → Ctrl+Q,c
keybind = cmd+t=text:\x11c

# ペイン閉じ: Cmd+W → Ctrl+Q,x
keybind = cmd+w=text:\x11x

# ワークスペース終了（確認付き）: Cmd+Shift+W → Ctrl+Q, Alt+X（herdr-kill-workspace-checked）
keybind = cmd+shift+w=text:\x11\x1b[120;3u

# サイドバー開閉: Cmd+S → Ctrl+Q,d（toggle_sidebar = "prefix+d"）
keybind = cmd+s=text:\x11d

# タブ切替: Cmd+1..9 → Alt+1..9（switch_tab = "alt+1..9"）
# kitty 形式の CSI u（CSI <codepoint> ; <modifier> u、Alt は modifier 3）で送る。動作確認済み。
# ESC 前置（\x1b1）は、下の digit_N 既定バインドの陰に隠れて単体では検証できていない
# （最初に試したときは digit_N が先にマッチしていた）。効かない可能性の根拠は、herdr が
# 外側の端末に kitty keyboard protocol を要求すると ESC+文字が Alt と解釈されなくなること。
# Ghostty の既定には `super+digit_N=goto_tab:N`（物理キー指定）が別に存在し、
# `cmd+N` を上書きしても物理キー側が先にマッチして goto_tab が動いてしまう。先に外す。
keybind = cmd+digit_1=unbind
keybind = cmd+digit_2=unbind
keybind = cmd+digit_3=unbind
keybind = cmd+digit_4=unbind
keybind = cmd+digit_5=unbind
keybind = cmd+digit_6=unbind
keybind = cmd+digit_7=unbind
keybind = cmd+digit_8=unbind
keybind = cmd+digit_9=unbind
keybind = cmd+1=text:\x1b[49;3u
keybind = cmd+2=text:\x1b[50;3u
keybind = cmd+3=text:\x1b[51;3u
keybind = cmd+4=text:\x1b[52;3u
keybind = cmd+5=text:\x1b[53;3u
keybind = cmd+6=text:\x1b[54;3u
keybind = cmd+7=text:\x1b[55;3u
keybind = cmd+8=text:\x1b[56;3u
keybind = cmd+9=text:\x1b[57;3u

# フルスクリーン: Alt+Enter（WezTerm の ToggleFullScreen と同じ）
keybind = alt+enter=toggle_fullscreen

# ---- WezTerm の keybinds.lua にあって Ghostty の既定と挙動が違うもの ----
# 設定リロード: WezTerm は Cmd+R。Ghostty 既定は Cmd+Shift+, なので合わせる
keybind = cmd+r=reload_config
# フォントサイズ: WezTerm は Cmd+= / Cmd+- / Cmd+0
keybind = cmd+equal=increase_font_size:1
keybind = cmd+minus=decrease_font_size:1
keybind = cmd+zero=reset_font_size
# ページスクロール: Ghostty 既定の shift+page_up は選択範囲の拡張なので、WezTerm と同じスクロールに戻す
keybind = shift+page_up=scroll_page_up
keybind = shift+page_down=scroll_page_down
