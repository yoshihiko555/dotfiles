onboarding = false

[keys]
# prefix は tmux と同じ Ctrl+Q（既定の Ctrl+B は Karabiner が left_arrow に変換して届かない）
prefix = "ctrl+q"

# ペインのズーム（tmux と同じ Alt+;）
zoom = "alt+semicolon"

# エージェント選択
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+alt+1..9"

# タブ切替（prefix+2..8 は N 分割に使う。Ghostty の Cmd+1..9 がここに届く）
switch_tab = "alt+1..9"

# ワークスペースの番号切替は置かない（Cmd+Shift+数字は macOS のスクリーンショット、
# prefix+数字は N 分割と衝突する）。prefix+w のピッカーを使う。

# ナビゲート（既定の prefix+g は lazygit に譲った）
goto = "prefix+m"

# サイドバー開閉（既定の prefix+b はエージェント・コンソールに譲った。Ghostty の Cmd+S がここに届く）
toggle_sidebar = "prefix+d"

# lazygit
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "zsh -ic 'lazygit'"
width = "80%"
height = "80%"

# 一時シェル
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "zsh"
width = "80%"
height = "80%"

# Claude Code
[[keys.command]]
key = "prefix+shift+c"
type = "popup"
command = "claude"
width = "90%"
height = "90%"

# クリップボードの URL を開く（コピーモードで yank したあとに使う）
[[keys.command]]
key = "prefix+u"
type = "shell"
command = "open \"$(pbpaste)\""

# GHQ プロジェクト picker
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/.config/herdr/bin/herdr-sessionizer"
width = "80%"
height = "70%"

# 現在のタブを N ペインに分割（prefix+2..8）
[[keys.command]]
key = "prefix+2"
type = "shell"
command = "~/.config/herdr/bin/herdr-split-layout 2"

[[keys.command]]
key = "prefix+3"
type = "shell"
command = "~/.config/herdr/bin/herdr-split-layout 3"

[[keys.command]]
key = "prefix+4"
type = "shell"
command = "~/.config/herdr/bin/herdr-split-layout 4"

[[keys.command]]
key = "prefix+5"
type = "shell"
command = "~/.config/herdr/bin/herdr-split-layout 5"

[[keys.command]]
key = "prefix+6"
type = "shell"
command = "~/.config/herdr/bin/herdr-split-layout 6"

[[keys.command]]
key = "prefix+7"
type = "shell"
command = "~/.config/herdr/bin/herdr-split-layout 7"

[[keys.command]]
key = "prefix+8"
type = "shell"
command = "~/.config/herdr/bin/herdr-split-layout 8"

# ペイン数に応じて nvim / claude / codex を起動
[[keys.command]]
key = "prefix+0"
type = "shell"
command = "~/.config/herdr/bin/herdr-init-panes"

# チートシート（この config.toml から生成）
[[keys.command]]
key = "prefix+i"
type = "popup"
command = "~/.config/herdr/bin/herdr-cheatsheet"
width = "90%"
height = "90%"

# 現在のワークスペースを終了（実行中プロセスがあれば確認）。Ghostty の Cmd+Shift+W がここに届く
[[keys.command]]
key = "prefix+alt+x"
type = "popup"
command = "~/.config/herdr/bin/herdr-kill-workspace-checked"
width = "70%"
height = "40%"

# Tokyo Night Moon に近い組み込みテーマを土台にする（未指定だと catppuccin 系になる）
[theme]
name = "tokyo-night"

[theme.custom]
# パネル背景を描かず、Ghostty の背景画像を見せる
panel_bg = "reset"
# 背景画像の上でサイドバーの文字が沈まないよう、Tokyo Night Moon の値で明るめに寄せる
text = "#c8d3f5"
subtext0 = "#828bb8"
overlay1 = "#737aa2"
overlay0 = "#545c7e"

[ui]
# アクティブペインの枠やハイライトの色
accent = "#82aaff"

# 状態表示を色の点ではなく記号にする
status_indicators = "symbols"

# スクロールバーは出さない（横 1 桁を内容に回す）
pane_scrollbars = false

# Cmd+T で新規タブを作るときに名前を聞かない（名前は herdr-automatic-rename が付ける）
prompt_new_tab_name = false

# 検出したエージェント名（claude / codex 等）をペイン境界に表示する
show_agent_labels_on_pane_borders = true

# タブバー右: リポジトリ/ワークツリー名 + 日時。command 型は色を付けられないので区切り文字で見分ける
tab_bar_right = [{ type = "command", command = "~/.config/herdr/bin/herdr-status-repo", interval_seconds = 5, timeout_seconds = 2 }, { type = "datetime", format = "%m/%d %H:%M" }]
tab_bar_right_separator = " │ "

# 承認待ちを一番上に出す（prefix+alt+1 が常に「いま待っているもの」になる）
agent_panel_sort = "priority"

[ui.sidebar.agents]
row_gap = 1
# 1 行目: 状態（色で強調）+ ワークスペース、2 行目: エージェント名 + タイトル。
# インラインテーブルは途中で改行できないため rules を持つ行は長くなる。
# dim = false は panel_bg = "reset" の上で SGR dim が背景に溶けて読めなくなるため。
rows = [
  ["state_icon", { token = "state_text", rules = [{ contains = "block", ignore_case = true, fg = "#ff757f", bold = true, dim = false }, { contains = "work", ignore_case = true, fg = "#ffc777", dim = false }, { contains = "done", ignore_case = true, fg = "#4fd6be", dim = false }, { contains = "idle", ignore_case = true, fg = "#828bb8", dim = false }, { contains = "unknown", ignore_case = true, fg = "#636da6", dim = false }] }, { token = "workspace", fg = "#c8d3f5", dim = false }],
  [
    # agent トークンの値は claude / codex / agy / opencode（設定キー名の open_code とは表記が違う）
    { token = "agent", rules = [{ contains = "claude", ignore_case = true, fg = "#CC7C5E", dim = false }, { contains = "codex", ignore_case = true, fg = "#49A3B0", dim = false }, { contains = "agy", ignore_case = true, fg = "#60BA7E", dim = false }, { contains = "opencode", ignore_case = true, fg = "#3B82F6", dim = false }] },
    { token = "terminal_title_stripped", fg = "#828bb8", dim = false },
  ],
]

[ui.sidebar.spaces]
# 並びは既定と同じ。背景画像の上で読めるよう色と dim = false だけ明示する
rows = [["state_icon", { token = "workspace", fg = "#c8d3f5", dim = false }], [{ token = "branch", fg = "#828bb8", dim = false }, "git_status"]]

[ui.toast]
# 画面内トーストに出す（prefix+o で通知元のペインへ移動できるのは画面内トーストのとき）。
# OS のバナーは herdr-terminal-notifier プラグインが herdr アイコンで出す
delivery = "herdr"

[ui.sound]
# 通知音の差し替え（done = 完了、request = 承認待ち）。herdr が読めるのは mp3 のみ。
# 相対パスは symlink を辿らず ~/.config/herdr/ 基準で解決されるため、dotfiles.nix で
# ~/.config/herdr/sounds を張っている（無いと組み込み音に無言でフォールバックする）。
done_path = "sounds/done.mp3"
request_path = "sounds/request.mp3"

# 承認待ちエージェント・コンソール（j/k で移動、w で承認待ちのみ、a で承認、Enter でペインへ）
[[keys.command]]
key = "prefix+b"
type = "popup"
command = "~/.config/herdr/bin/herdr-agent-console"
width = "90%"
height = "80%"

# Alt+H/J/K/L: ペイン移動（フォアグラウンドが Neovim ならキーを転送して smart-splits.nvim に任せる）
[[keys.command]]
key = "alt+h"
type = "shell"
command = "~/.config/herdr/bin/herdr-smart-move left"

[[keys.command]]
key = "alt+j"
type = "shell"
command = "~/.config/herdr/bin/herdr-smart-move down"

[[keys.command]]
key = "alt+k"
type = "shell"
command = "~/.config/herdr/bin/herdr-smart-move up"

[[keys.command]]
key = "alt+l"
type = "shell"
command = "~/.config/herdr/bin/herdr-smart-move right"

# Alt+Shift+H/J/K/L: ペインリサイズ（Neovim の判定は移動と同じ）
[[keys.command]]
key = "alt+shift+h"
type = "shell"
command = "~/.config/herdr/bin/herdr-smart-move resize-left"

[[keys.command]]
key = "alt+shift+j"
type = "shell"
command = "~/.config/herdr/bin/herdr-smart-move resize-down"

[[keys.command]]
key = "alt+shift+k"
type = "shell"
command = "~/.config/herdr/bin/herdr-smart-move resize-up"

[[keys.command]]
key = "alt+shift+l"
type = "shell"
command = "~/.config/herdr/bin/herdr-smart-move resize-right"

# タブ名を自動命名に戻す（手動でリネームしたタブは herdr-automatic-rename の対象外になるため）
[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "herdr-automatic-rename.reset"

# terminal-browser に必要。herdr のソケット経由で direct-kitty 転送を使えるようにする
# （無いと terminal-browser が無言の空白ペインになる。zenbu-labs/terminal-browser#89）。
# 条件: 外側の端末が Ghostty / kitty、アタッチ中のクライアントが 1 つ、ssh / tmux / --remote 経由でない。
# 変更の反映には reload-config に加えてデタッチ → 再アタッチが要る。
[experimental]
kitty_graphics = true
