shell = "zsh"

[plugins]

# プロンプト表示後に読み込む仕組み。defer テンプレートを使うプラグインより前に置く
[plugins.zsh-defer]
github = "romkatv/zsh-defer"

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"

# compinit を fzf-tab より前に実行する。
# compinit はプロンプト表示後に遅延実行するため、それまでの compdef 呼び出しは溜めて後で再実行する
[plugins.compinit]
inline = '''
autoload -Uz compinit
typeset -ga _deferred_compdefs
compdef() { local -a a; a=("${(q)@}"); _deferred_compdefs+=("${(j: :)a}") }
zsh-defer -dmp -c 'compinit -i
  local _c; for _c in $_deferred_compdefs; do eval "compdef $_c"; done
  unset _deferred_compdefs'
'''

[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"
apply = ["defer"]

# fzf-tab UI カスタマイズ（tmux popup）
[plugins.fzf-tab-config]
inline = '''
zstyle ':fzf-tab:*' fzf-command ftb-tmux-popup
zstyle ':fzf-tab:*' fzf-flags \
    --layout=reverse \
    --border=rounded \
    --border-label=" 補完 " \
    --no-info \
    --pointer="▶" \
    --marker="●" \
    --color=fg:#c0caf5,bg:#1a1b26,hl:#ff9e64 \
    --color=fg+:#c0caf5,bg+:#33467c,hl+:#ff9e64 \
    --color=pointer:#9ece6a,marker:#9ece6a,border:#565f89,label:#7aa2f7
# tmux popup のサイズ
zstyle ':fzf-tab:*' popup-min-size 80 12
# グループのスイッチキー
zstyle ':fzf-tab:*' switch-group "<" ">"
# グループヘッダーを表示
zstyle ':fzf-tab:*' show-group brief
# パディング
zstyle ':fzf-tab:*' fzf-pad 4
'''

# 略語。打った語を space / Enter で元のコマンドに展開する（fish の abbr と同じ動き）。
# zsh-syntax-highlighting より前に置く。ハイライトは読み込んだ時点の widget だけを包むので、
# zsh-abbr が置き換える space と accept-line を先に定義しておく。
# ライセンスは CC BY-NC-SA 4.0。依存する zsh-job-queue はサブモジュールで、sheldon が一緒に取得する
[plugins.zsh-abbr]
github = "olets/zsh-abbr"
apply = ["defer"]

# 略語の宣言は shell/zsh/abbreviations.zsh が正本。zsh-abbr を読み込んだ後に読む
[plugins.abbreviations]
inline = '''
zsh-defer -dmp source ~/.zsh/abbreviations.zsh
'''

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
apply = ["defer-autosuggest"]

[plugins.zsh-autosuggestions-abbreviations-strategy]
github = "olets/zsh-autosuggestions-abbreviations-strategy"
apply = ["defer"]

[plugins.autosuggestions-config]
inline = '''
ZSH_AUTOSUGGEST_HIGHLIGHT_STYLE='fg=#7aa2f7'
# プラグインが用意する履歴候補より先に、略語名を候補に出す。
zsh-defer -dmp -c 'ZSH_AUTOSUGGEST_STRATEGY=(abbreviations ${ZSH_AUTOSUGGEST_STRATEGY:#abbreviations})'
'''

# シンタックスハイライト。読み込んだ時点の widget を包むため、最後に置く。
# defer テンプレートは -z を付けないので、読み込み後に今の行のハイライトが作り直される
[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"
apply = ["defer"]

# 閉じていない引用符を赤の太字にする。既定では閉じた引用符と同じ色（黄）を引き継ぎ、見分けがつかない。
# プラグインは未設定の色だけを既定値で埋めるので、遅延読み込みより先に（ここは同期で）入れておく
[plugins.zsh-syntax-highlighting-config]
inline = '''
typeset -gA ZSH_HIGHLIGHT_STYLES
ZSH_HIGHLIGHT_STYLES[single-quoted-argument-unclosed]='fg=red,bold'
ZSH_HIGHLIGHT_STYLES[double-quoted-argument-unclosed]='fg=red,bold'
ZSH_HIGHLIGHT_STYLES[dollar-quoted-argument-unclosed]='fg=red,bold'
ZSH_HIGHLIGHT_STYLES[back-quoted-argument-unclosed]='fg=red,bold'
'''

# 遅延読み込み。precmd / chpwd フックの再実行と再描画は副作用が出るため止める（-dmp）
[templates]
defer = "{% for file in files %}zsh-defer -dmp source \"{{ file }}\"\n{% endfor %}"
# 自動提案は precmd で開始するため、読み込み直後に開始処理を直接呼ぶ
defer-autosuggest = "{% for file in files %}zsh-defer -dmp -c 'source \"{{ file }}\" && _zsh_autosuggest_start'\n{% endfor %}"
