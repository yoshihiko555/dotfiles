# config-version = 2 の変更点は persistent-workspaces の扱いのみ。
# v1 はキーバインドの右辺からワークスペースを推論していたが（公式いわく error-prone）、
# v2 では明示指定が必要になったため下で列挙する。
config-version = 2

after-login-command = []
after-startup-command = ['exec-and-forget ~/.config/aerospace/layouts/default.sh']
start-at-login = true

# ワークスペース切替時にオーバーレイ系アプリを追従させる
# （AeroSpace に sticky window が無いための回避策。詳細は scripts/follow-overlay.sh）
exec-on-workspace-change = ['/bin/bash', '-c', '~/.config/aerospace/scripts/follow-overlay.sh']

# ウィンドウが無くても残すワークスペース（v1 では自動推論されていた）
persistent-workspaces = ['M1', 'M2', 'M3', 'M4', 'S1', 'S2', 'S3', 'S4', 'B1', 'B2', 'B3']

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.right = 0
outer.top = 0
outer.bottom = 0

[mode.main.binding]
ctrl-1 = 'workspace M1'
ctrl-2 = 'workspace M2'
ctrl-3 = 'workspace M3'
ctrl-4 = 'workspace S1'
ctrl-5 = 'workspace S2'
ctrl-6 = 'workspace S3'
ctrl-7 = 'workspace B1'
ctrl-8 = 'workspace B2'
ctrl-9 = 'workspace M4'
# S4 / B3 は 2026-09-30 に追加。既存の並びを崩さないよう空いているキーへ割り当てた。
# 数字キーが足りないため B3 は ctrl-shift-1（元はレイアウトプリセット）を使う。
ctrl-0 = 'workspace S4'
ctrl-shift-1 = 'workspace B3'

# 同じモニター内でワークスペースを左右に巡回（2026-09-02 追加）
# macOS の「スペースを左右に移動」（ctrl-←/→）の操作感を再現するもの。
# その ctrl-←/→ は symbolichotkeys 79/81 を無効化済みなので空いている。
# Karabiner の ctrl-b/f → ←/→ 変換は ctrl を落として素の矢印を送るため、
# ターミナルでの ctrl-b / ctrl-f が誤ってここに当たることはない。
# 標準の `workspace next|prev` は全 WS をアルファベット順に回り
# 3 回押すごとにフォーカスが別モニターへ飛ぶため、スクリプトで
# 「今いるモニターの WS だけ」に絞っている（詳細は scripts/workspace-cycle.sh）。
# BTT のトラックパッドスワイプからも同じスクリプトを呼ぶ。
ctrl-left = 'exec-and-forget ~/.config/aerospace/scripts/workspace-cycle.sh prev'
ctrl-right = 'exec-and-forget ~/.config/aerospace/scripts/workspace-cycle.sh next'

# アクティブなウィンドウを指定ワークスペースへ移動（2026-09-02 追加）
# キー割り当ては上の workspace 切替（ctrl-N）と同じ並びに揃えている。
# --focus-follows-window は意図的に付けていない。ウィンドウだけ退避して
# 今の画面で作業を続けたいため（モニター移動の alt-shift-←/→ とは方針が異なる）。
# ctrl-cmd-数字 は macOS 標準・herdr / Ghostty / tmux / WezTerm / Karabiner のいずれも未使用。
# 当初は ctrl-alt-N だったが、2026-09-30 に ctrl-cmd-N へ変更。
ctrl-cmd-1 = 'move-node-to-workspace M1'
ctrl-cmd-2 = 'move-node-to-workspace M2'
ctrl-cmd-3 = 'move-node-to-workspace M3'
ctrl-cmd-4 = 'move-node-to-workspace S1'
ctrl-cmd-5 = 'move-node-to-workspace S2'
ctrl-cmd-6 = 'move-node-to-workspace S3'
ctrl-cmd-7 = 'move-node-to-workspace B1'
ctrl-cmd-8 = 'move-node-to-workspace B2'
ctrl-cmd-9 = 'move-node-to-workspace M4'
ctrl-cmd-0 = 'move-node-to-workspace S4'
# B3（OrbStack）は自動配置ルールで入るため、送るキーは設けていない。

# ウィンドウを隣のモニターへ移動（BetterTouchTool から移管、2026-09-02）
# BTT 版はウィンドウを物理的に動かすだけで AeroSpace のワークスペース把握とズレるため、
# こちらへ寄せた。BTT 側の同キー設定は削除すること（両方生きていると二重に発火する）。
# 最大化・左右半分スナップは AeroSpace に相当機能が無いため BTT に残している。
# 物理配置は左から 本体 → メイン DELL → サブ DELL。
# next/prev はトレイアイコンの並び順で物理方向と一致しないため left/right を使う。
# --focus-follows-window が無いとフォーカスが元のワークスペースに残り、
# 続けて押したときに別のウィンドウが動いてしまう。
# --wrap-around は端で止まらず反対側へ回り込む（BTT 版の挙動に合わせる）。
alt-shift-left = 'move-node-to-monitor --focus-follows-window --wrap-around left'
alt-shift-right = 'move-node-to-monitor --focus-follows-window --wrap-around right'

# アクティブなウィンドウをワークスペース全域に広げる（トグル、2026-09-02 追加）
# 同じアプリの別ウィンドウ（Chrome のプロファイル別など）が分割表示されたときに、
# 見たい方だけ一時的に広げる用途。BTT の alt-↑（最大化）から移管したため、
# BTT 側の同キー設定は削除すること（両方生きていると二重に発火する）。
# Karabiner の ctrl-p → ↑ 変換により ctrl-alt-p でも同じバインドが発火する。
# 仕様: 同じワークスペース内の別ウィンドウにフォーカスを移すと自動的に解除される
# （AeroSpace 公式ドキュメント記載）。常に片方を広く使いたいなら下の accordion を使う。
alt-up = 'fullscreen'

# 分割の仕方を tiles ⇄ accordion で切り替える（トグル）
# accordion は非アクティブ側を端に細く畳むので、常に片方を広く使いたいとき向け。
# 一時的に広げたいだけなら上の alt-↑ を使う。
# a = accordion。Karabiner が横取りする b/f/h/n/p/q/space を避けた選択。
ctrl-alt-a = 'layout accordion tiles'

# レイアウトプリセットのキー（ctrl-shift-1 = default.sh / ctrl-shift-2 = dev.sh）は
# 2026-09-30 に廃止。default.sh は after-startup-command からのみ実行する。

# アプリを問わず、新規ウィンドウの移動先 WS を枚数に応じて整列する。
# 後続の floating / move ルールも実行し、スクリプト側で反映を待つ。
[[on-window-detected]]
check-further-callbacks = true
run = ['exec-and-forget /bin/bash ~/.config/aerospace/scripts/auto-grid.sh']

# オーバーレイ系アプリをタイル管理から除外
# Aqua Voice の音声入力オーバーレイがタイルに組み込まれてリサイズされるのを防ぐ。
# 注意: これはタイリングエンジンからの除外のみで、ワークスペース束縛は解けない
# （2026-09-02 に実測で確認）。ワークスペースをまたいで見え続けさせる処理は
# exec-on-workspace-change → scripts/follow-overlay.sh が担当する。
[[on-window-detected]]
if.app-id = 'com.electron.aqua-voice'
run = ['layout floating']

# アプリ自動配置
#
# 配置方針:
#   M 系（メイン DELL）= 常時見るもの（ブラウザ・ターミナル）
#   S 系（サブ DELL）  = 参照・開発・雑務
#   B 系（本体）       = コミュニケーション
#
# Claude Desktop は意図的にルールを持たない（開いた場所に留める、2026-09-02）

# --- M 系: メイン DELL ---
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['move-node-to-workspace M1']

[[on-window-detected]]
if.app-id = 'company.thebrowser.dia'
run = ['move-node-to-workspace M2']

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = ['move-node-to-workspace M3']

# Ghostty: 2026-09-23 に常用端末を WezTerm から移行（docs/adr/ADR-20260922-0001）。WezTerm と同じ枠
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace M3']

# M4 は Hermes の画面共有などに使う空き枠。自動配置ルールは置かない。

# --- S 系: サブ DELL ---
[[on-window-detected]]
if.app-id = 'notion.id'
run = ['move-node-to-workspace S1']

# S2 はエディタ / DB 枠。同時に開くことは稀なので 1 ワークスペースに同居させる。
[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = ['move-node-to-workspace S2']

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = ['move-node-to-workspace S2']

[[on-window-detected]]
if.app-id = 'com.TablePro'
run = ['move-node-to-workspace S2']

# S3: Finder（2026-09-30 追加）
# ルールが無いとフォーカス中の WS（開発中は S2 が多い）に溜まっていくため専用枠にした。
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['move-node-to-workspace S3']

# S4: 雑アプリ・一時ウィンドウ
# 元は本体側の B3 → S3 に置いていた（2026-09-02 に本体からサブ DELL へ移設）。
# 2026-09-30 に S3 を Finder に譲り S4 へ移した。
# ルールの無いアプリをまとめて S4 へ送る catch-all は意図的に置かない
# （開いたウィンドウが目の前に出ず、ダイアログ類も飛ぶため。2026-03-20 にも一度撤回済み）。
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['move-node-to-workspace S4']

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = ['move-node-to-workspace S4']

[[on-window-detected]]
if.app-id = 'com.coteditor.CotEditor'
run = ['move-node-to-workspace S4']

# --- B 系: Mac 本体 ---
# B1: チャット
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace B1']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace B1']

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = ['move-node-to-workspace B1']

# B2: メール・予定
[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = ['move-node-to-workspace B2']

[[on-window-detected]]
if.app-id = 'com.cron.electron'
run = ['move-node-to-workspace B2']

# B3: 開発用の常駐ツール（2026-09-30 追加）
# 2026-09-02 に廃止した旧 B3（雑アプリ）とは別用途で再設。
[[on-window-detected]]
if.app-id = 'dev.kdrag0n.MacVirt'
run = ['move-node-to-workspace B3']

# ルールにないアプリは現在フォーカス中のワークスペースに留まる
# (catch-all の move を削除し、デフォルト動作に任せる)

# モニター固定
# 1 = Built-in Retina Display (Mac本体)
# 2 = DELL U2720QM (メイン)
# 3 = DELL G2422HS (サブ)
[workspace-to-monitor-force-assignment]
M1 = 2
M2 = 2
M3 = 2
M4 = 2
S1 = 3
S2 = 3
S3 = 3
S4 = 3
B1 = 1
B2 = 1
B3 = 1
