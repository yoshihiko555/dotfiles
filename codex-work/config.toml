# ~/.codex-work/config.toml からリンクする、会社用 Codex CLI 設定の正本。
# 個人用とは独立して管理する。CLI が書き戻す設定もこのファイルに反映される。
model_reasoning_effort = "high"
personality = "pragmatic"
web_search = "live"
approval_policy = "on-request"
default_permissions = "guarded-workspace"

# ChatGPT の会社アカウントで認証する。個人用の認証ファイルは共有しない。
forced_login_method = "chatgpt"
cli_auth_credentials_store = "file"

[permissions.guarded-workspace]
extends = ":workspace"

[permissions.guarded-workspace.filesystem]
"~/.config/homebase/agent-token" = "none"

[permissions.guarded-workspace.network]
enabled = true

[tui]
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-6.1-sol" = 1

[projects."/Users/yoshihiko/ghq/github.com/yoshihiko555/dotfiles"]
trust_level = "trusted"
