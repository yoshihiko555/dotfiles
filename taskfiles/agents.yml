version: "3"

tasks:
  # ====================
  # Agent コンテキストファイル同期
  # ====================
  sync-agents:
    desc: shared/agents/core.md + diff-*.md から Codex/Gemini の AGENTS.md を生成
    cmds:
      - |
        set -eu
        root="{{.ROOT_DIR}}"
        src="$root/shared/agents"

        gen() {
          diff_file="$1"
          out="$2"
          {
            echo "<!-- AUTO-GENERATED by 'task sync-agents' — DO NOT EDIT."
            echo "     Edit shared/agents/core.md or shared/agents/$diff_file instead. -->"
            echo
            cat "$src/core.md"
            echo
            cat "$src/$diff_file"
          } > "$out"
          echo "generated: $out"
        }

        gen diff-codex.md  "$root/codex/AGENTS.md"
        gen diff-gemini.md "$root/gemini/AGENTS.md"
