version: "3"

tasks:
  # ====================
  # CLIProxyAPI (ccx 用プロキシ)
  # ====================
  cliproxy-setup:
    desc: CLIProxyAPI を導入しテンプレートから設定を生成 (冪等・キーは引き継ぐ)
    cmds:
      - |
        set -euo pipefail
        CONF="$(brew --prefix)/etc/cliproxyapi.conf"
        TMPL="{{.ROOT_DIR}}/shared/cliproxyapi/conf.tmpl"
        FRAG="{{.ROOT_DIR}}/shared/cliproxyapi/openai-compat.tmpl"
        SECRETS="${XDG_CONFIG_HOME:-$HOME/.config}/cliproxyapi/secrets.env"

        command -v cliproxyapi >/dev/null || brew install cliproxyapi

        # 既存 conf のキーを引き継ぎ、なければ新規生成 (テンプレートのプレースホルダは Git 管理外の実体だけに展開)
        KEY=""
        if [ -f "$CONF" ]; then
          KEY=$(sed -n '/^api-keys:/{n;s/.*"\(.*\)".*/\1/p;}' "$CONF")
        fi
        case "$KEY" in ""|your-api-key-*|__CLIPROXY_API_KEY__) KEY=$(openssl rand -hex 24);; esac
        sed "s/__CLIPROXY_API_KEY__/$KEY/" "$TMPL" > "$CONF"
        echo "✅ 設定を生成: $CONF"

        # OpenAI 互換プロバイダ: secrets.env がある場合のみ雛形を展開して追記
        if [ -f "$SECRETS" ]; then
          set -a; . "$SECRETS"; set +a
          # コピペで混入しがちなゼロ幅文字・CR・前後空白を除去する。
          # (U+200B 混入で上流が 401 → auth_unavailable になる事故があったため)
          MISSING=""
          for v in OPENAI_COMPAT_NAME OPENAI_COMPAT_BASE_URL OPENAI_COMPAT_API_KEY; do
            eval "val=\${$v:-}"
            clean=$(printf '%s' "$val" | perl -CSD -pe 's/[\x{200B}-\x{200F}\x{FEFF}\x{2060}\r]//g; s/^\s+|\s+$//g')
            if [ "$val" != "$clean" ]; then
              echo "⚠️  $v に不可視文字/余分な空白を検出したため除去した ($SECRETS も直すこと)"
              eval "$v=\$clean"
            fi
            [ -n "$clean" ] || MISSING="$MISSING $v"
          done
          if [ -n "$MISSING" ]; then
            echo "⚠️  $SECRETS の未設定項目:$MISSING → openai-compatibility はスキップ"
          else
            printf '\n' >> "$CONF"
            sed -e "s|__OPENAI_COMPAT_NAME__|$OPENAI_COMPAT_NAME|" \
                -e "s|__OPENAI_COMPAT_BASE_URL__|$OPENAI_COMPAT_BASE_URL|" \
                -e "s|__OPENAI_COMPAT_API_KEY__|$OPENAI_COMPAT_API_KEY|" \
                "$FRAG" >> "$CONF"
            echo "✅ openai-compatibility を追記: $OPENAI_COMPAT_NAME"
          fi
        else
          echo "ℹ️  $SECRETS が無いため openai-compatibility はスキップ"
          echo "    使う場合: cp shared/cliproxyapi/secrets.env.example \"$SECRETS\" && chmod 600 \"$SECRETS\""
        fi

        ls ~/.cli-proxy-api/codex-*.json  >/dev/null 2>&1 || echo "⚠️  Codex 未認証:  cliproxyapi --codex-login"
        ls ~/.cli-proxy-api/claude-*.json >/dev/null 2>&1 || echo "⚠️  Claude 未認証: cliproxyapi --claude-login"

        brew services restart cliproxyapi
        echo "✅ サービス再起動完了。ccx で利用できます"

  cliproxy-auth-prune:
    desc: 新しい認証に置き換わって不要になった失効ファイルを削除 (既定は確認のみ)
    silent: true
    cmds:
      - "{{.ROOT_DIR}}/scripts/cliproxy-auth-prune.sh {{.CLI_ARGS}}"

  cliproxy-status:
    desc: CLIProxyAPI の稼働状態・OAuth 期限・公開モデルを確認
    silent: true
    cmds:
      - |
        CONF="$(brew --prefix)/etc/cliproxyapi.conf"
        KEY=$(sed -n '/^api-keys:/{n;s/.*"\(.*\)".*/\1/p;}' "$CONF")

        echo "── サービス ──────────────────────────────"
        brew services info cliproxyapi | sed 's/^/  /'

        # 認証の期限。Running でも OAuth が切れていると 503 auth_unavailable になるため、
        # モデル一覧より先にここを見る。
        echo ""
        echo "── OAuth 認証 ────────────────────────────"
        expired_any=0
        shopt -s nullglob 2>/dev/null || true
        for f in "$HOME"/.cli-proxy-api/*.json; do
          [ -e "$f" ] || continue
          kind=$(jq -r '.type // "?"' "$f")
          exp=$(jq -r '.expired // empty' "$f")
          name=$(basename "$f" .json)
          if [ -z "$exp" ]; then
            printf '  ?  %-6s %-44s 期限情報なし\n' "$kind" "$name"
            continue
          fi
          left=$(python3 -c 'import sys,datetime;d=datetime.datetime.fromisoformat(sys.argv[1]);print(round((d-datetime.datetime.now(d.tzinfo)).total_seconds()/86400))' "$exp" 2>/dev/null)
          when="${exp%%T*} $(printf '%s' "${exp#*T}" | cut -c1-5)"
          if [ -z "$left" ]; then
            printf '  ?  %-6s %-44s %s (日数を計算できず)\n' "$kind" "$name" "$when"
          elif [ "$left" -lt 0 ]; then
            expired_any=1
            printf '  ✘  %-6s %-44s %s に失効 (%s日前)\n' "$kind" "$name" "$when" "${left#-}"
          else
            printf '  ✔  %-6s %-44s %s まで有効 (残り%s日)\n' "$kind" "$name" "$when" "$left"
          fi
        done
        if [ "$expired_any" = 1 ]; then
          echo ""
          echo "  ✘ の認証は cliproxyapi --<type>-login で再取得する。"
          echo "  再ログインで別名のファイルが作られることがあり、古い方が残っていると"
          echo "  プロキシがそれを掴んで 503 になる。不要な失効ファイルは削除すること。"
          echo "  再ログイン後は brew services restart cliproxyapi が必要。"
        fi

        # /v1/models はヘッダ次第で内容が変わる。ここでは素の全件を出す。
        # Claude Code の /model ピッカーに並ぶのは claude/anthropic 始まりだけ。
        echo ""
        echo "── 公開モデル (★ = /model ピッカーに出る) ──"
        if ! curl -sf -m 3 http://127.0.0.1:8317/v1/models -H "Authorization: Bearer $KEY" \
             | jq -r '.data[].id' | sort \
             | sed -E -e 's/^(claude|anthropic)/★ &/' -e 's/^([^★])/  \1/'; then
          echo "  ⚠️  プロキシに接続できません"
        fi
