version: "3"

tasks:
  # ====================
  # ユーティリティ
  # ====================
  status:
    desc: リンク適用後やトラブル時に現在のシンボリックリンク状態を確認
    # NOTE: dotfiles を指す symlink だけを抽出する。アプリが自前で書き込む実ファイル
    # (~/.gemini/conversations 等) は対象外。壊れたリンクは BROKEN として表示する。
    silent: true
    cmds:
      - |
        show_links() {
          label="$1"; shift
          echo "📁 ${label}:"
          found=0
          for target in "$@"; do
            # symlink 自身、またはディレクトリ直下 1 階層の symlink を列挙する
            if [ -L "$target" ]; then
              links=$(printf '%s\n' "$target")
            elif [ -d "$target" ]; then
              links=$(find "$target" -maxdepth 1 -type l 2>/dev/null | sort)
            else
              continue
            fi
            for link in $links; do
              dest=$(readlink "$link")
              case "$dest" in
                *dotfiles*) ;;
                *) continue ;;
              esac
              found=1
              if [ -e "$link" ]; then
                echo "  ✅ ${link#$HOME/} -> $dest"
              else
                echo "  ❌ BROKEN: ${link#$HOME/} -> $dest"
              fi
            done
          done
          if [ "$found" -eq 0 ]; then
            echo "  (not linked)"
          fi
          echo ""
        }

        show_links "Shell"        ~/.zshrc ~/.zprofile
        show_links "Config"       ~/.config/wezterm ~/.config/starship ~/.config/mise ~/.config/sheldon
        show_links "Tmux"         ~/.config/tmux
        show_links "Claude"       ~/.claude
        show_links "Codex"        ~/.codex
        show_links "Gemini"       ~/.gemini ~/.gemini/antigravity ~/.gemini/antigravity-cli ~/.gemini/config
        show_links "takt"         ~/.takt
        show_links "EditorConfig" ~/.editorconfig
        show_links "Alfred"       ~/Dropbox/02_Private/08_Settings/02_Alfred/Alfred.alfredpreferences/workflows

  brew:
    desc: 新しい Mac の初期構築時に Homebrew パッケージをインストール
    cmds:
      - bash {{.ROOT_DIR}}/scripts/install-brew.sh
      - brew bundle --file={{.ROOT_DIR}}/Brewfile

  edit:
    desc: dotfiles を編集したいときに VS Code で開く
    cmds:
      - code {{.ROOT_DIR}}

  mcp-init:
    desc: 新規プロジェクト向けに最小構成の .mcp.json を作成（MCP なし）
    cmds:
      - |
        if [ -f .mcp.json ]; then
          echo "⚠️  .mcp.json already exists. Use 'task mcp-show' to view template."
        else
          cp {{.ROOT_DIR}}/shared/mcp.template.json .mcp.json
          echo "✅ .mcp.json (minimal) created. Edit as needed."
        fi

  mcp-show:
    desc: mcp-init 用（最小構成）MCP テンプレート内容を確認
    cmds:
      - cat {{.ROOT_DIR}}/shared/mcp.template.json

  clean-claude:
    desc: Claude Code のログ容量を減らしたいときにデバッグログを削除
    cmds:
      - bash {{.ROOT_DIR}}/scripts/clean-claude.sh

  clean-claude-dry:
    desc: clean-claude 実行前に削除対象だけ確認する dry-run
    cmds:
      - bash {{.ROOT_DIR}}/scripts/clean-claude.sh --dry-run

  codex-trust-audit:
    desc: Codex の信頼済みプロジェクト設定を棚卸しして stale 設定を検知
    cmds:
      - bash {{.ROOT_DIR}}/scripts/codex-trust-audit.sh
