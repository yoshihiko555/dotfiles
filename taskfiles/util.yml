version: "3"

tasks:
  # ====================
  # ユーティリティ
  # ====================
  status:
    desc: home-manager の配線と mutable 設定の drift を確認
    silent: true
    cmds:
      - |
        root="{{.ROOT_DIR}}"

        show_link() {
          label="$1"
          target="$2"
          if [ ! -L "$target" ]; then
            echo "❌ $label: ${target#$HOME/} is not a symlink"
            return
          fi
          resolved=$(realpath "$target" 2>/dev/null || true)
          case "$resolved" in
            "$root"/*) echo "✅ $label: ${target#$HOME/} -> ${resolved#$root/}" ;;
            *) echo "❌ $label: ${target#$HOME/} -> $resolved" ;;
          esac
        }

        show_mutable() {
          label="$1"
          current="$2"
          reference="$3"
          if [ ! -f "$current" ] || [ ! -f "$reference" ]; then
            echo "❌ $label: mutable file or reference is missing"
            return
          fi
          current_normalized=$(mktemp)
          reference_normalized=$(mktemp)
          jq -S . "$current" > "$current_normalized"
          jq -S . "$reference" > "$reference_normalized"
          if cmp -s "$current_normalized" "$reference_normalized"; then
            echo "✅ $label: managed real file (no drift)"
          else
            echo "⚠️  $label: drift detected"
          fi
          rm -f "$current_normalized" "$reference_normalized"
        }

        show_link "Shell" ~/.zshrc
        show_link "XDG config" ~/.config/wezterm
        show_link "Tmux" ~/.config/tmux
        show_link "Claude" ~/.claude/CLAUDE.md
        show_mutable "Claude settings" ~/.claude/settings.json ~/.claude/.settings.json.nix-managed
        show_link "Codex" ~/.codex/config.toml
        show_link "Gemini" ~/.gemini/AGENTS.md
        show_mutable "Antigravity settings" ~/.gemini/antigravity-cli/settings.json ~/.gemini/antigravity-cli/.settings.json.nix-managed
        show_mutable "Antigravity keybindings" ~/.gemini/antigravity-cli/keybindings.json ~/.gemini/antigravity-cli/.keybindings.json.nix-managed
        show_link "takt" ~/.takt/config.yaml
        show_link "EditorConfig" ~/.editorconfig
        show_link "Alfred" ~/Dropbox/02_Private/08_Settings/02_Alfred/Alfred.alfredpreferences/workflows/user.workflow.C9692AD7-2800-42B7-8F97-8F8CCD1CC88E

  edit:
    desc: dotfiles を編集したいときに VS Code で開く
    cmds:
      - code {{.ROOT_DIR}}

  mcp-init:
    desc: 新規プロジェクト向けに最小構成の .mcp.json を作成（MCP なし）
    cmds:
      - |
        if [ -f .mcp.json ]; then
          echo "⚠️  .mcp.json already exists. Use 'task mcp-show' to view template."
        else
          cp {{.ROOT_DIR}}/shared/mcp.template.json .mcp.json
          echo "✅ .mcp.json (minimal) created. Edit as needed."
        fi

  mcp-show:
    desc: mcp-init 用（最小構成）MCP テンプレート内容を確認
    cmds:
      - cat {{.ROOT_DIR}}/shared/mcp.template.json

  clean-claude:
    desc: Claude Code のログ容量を減らしたいときにデバッグログを削除
    cmds:
      - bash {{.ROOT_DIR}}/scripts/clean-claude.sh

  clean-claude-dry:
    desc: clean-claude 実行前に削除対象だけ確認する dry-run
    cmds:
      - bash {{.ROOT_DIR}}/scripts/clean-claude.sh --dry-run

  codex-trust-audit:
    desc: Codex の信頼済みプロジェクト設定を棚卸しして stale 設定を検知
    cmds:
      - bash {{.ROOT_DIR}}/scripts/codex-trust-audit.sh

  # ====================
  # Nix flake（config/.config/nix）
  # status タスク（symlink drift 確認）とは別軸。
  # こちらは flake 自体の評価とフォーマットを検査・整形する
  # ====================
  nix-check:
    desc: nix flake の評価とフォーマット検査を実行（nix flake check）
    cmds:
      - nix flake check {{.ROOT_DIR}}/config/.config/nix

  nix-fmt:
    desc: nix + shell + yaml/toml を treefmt で整形（nix fmt）。lua/md/json は対象外
    cmds:
      - cd {{.ROOT_DIR}}/config/.config/nix && nix fmt
