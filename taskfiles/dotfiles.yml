version: "3"

tasks:
  adopt-settings:
    desc: アプリが変更した mutable 設定を確認し、repo 側へ回収
    summary: |
      使い方: TARGET=all|claude|claude-work|antigravity-settings|antigravity-keybindings
      例: task adopt-settings TARGET=claude
    vars:
      TARGET: '{{default "all" .TARGET}}'
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/adopt-managed-settings.sh" "{{.TARGET}}"

  btt-export:
    desc: BetterTouchTool の現在のトリガー設定を repo へ回収
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/btt-sync.sh" export

  btt-apply:
    desc: repo の BetterTouchTool 設定を実機へ適用（switch でも自動実行される）
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/btt-sync.sh" apply

  loupedeck-export:
    desc: Loupedeck Live の現在のプロファイルを repo へ回収
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/loupedeck-sync.sh" export

  loupedeck-apply:
    desc: repo の Loupedeck Live プロファイルを実機へ適用（switch でも自動実行される）
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/loupedeck-sync.sh" apply
